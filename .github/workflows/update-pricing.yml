name: Update list prices

# Weekly: pull models.dev into models/modelPricing.ts and open a pull request
# when a price changed (ADR-163). The release build never fetches prices; a
# human reads this diff, merges it, and the next release ships it.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled
# under Settings → Actions → General → Workflow permissions.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

# Both write scopes sit in the same job as the models.dev fetch. Splitting them
# (a fetch job with `permissions: {}` handing the file over as an artifact) was
# considered and deliberately not done — engineering-review #287 has the full
# reasoning. In short: the fetch only parses data, `fmt` validates every value
# on the way in (#285), `npm ci --ignore-scripts` removed the code that could
# actually run here (#286), and a human reads this PR before it merges.
#
# Reopen that decision if either changes:
#   - a step here starts EXECUTING something fetched at runtime, not just
#     parsing it (a codegen tool, a downloaded script, a schema binary); or
#   - this PR is ever auto-merged, removing the human read.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Fetch models.dev and open a PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: no dependency's install hook runs in the same job as
        # the token (engineering-review #286). Nothing here needs one — esbuild's
        # binary arrives via its platform optional dependency and onnxruntime-node
        # ships its CPU binary in-package, both as plain files in the tarball.
        run: npm ci --ignore-scripts

      - name: Update the price table
        run: npm run update:pricing

      - name: Check the table still passes its tests
        run: npx vitest run tests/modelPricing.test.ts tests/updatePricing.test.ts

      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-pricing
          delete-branch: true
          commit-message: "Update list prices from models.dev"
          title: "Update list prices (models.dev)"
          body: |
            Weekly price refresh from https://models.dev — `models/modelPricing.ts` rewritten by `npm run update:pricing`.

            Review the diff line by line: these are the numbers every answer's `≈ $` estimate is built from. They are still an estimate, not a bill, and the plugin says so; but a wrong upstream value should stop here, not ship.

            Merge to make the next release carry them. No other file changes.
