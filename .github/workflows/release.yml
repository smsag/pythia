name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.20.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag says one thing and the manifest says another — and Obsidian
      # believes the manifest: its installer reads manifest.json's `version`,
      # not the tag it downloaded from. A release published with the two out of
      # step hands every user the WRONG version under the right name, and the
      # tag cannot be reused without deleting the release first. So this fails
      # before anything is built or published, never after.
      #
      # `workflow_dispatch` is the reason it is needed: the tag-push trigger is
      # already constrained by the `[0-9]+.[0-9]+.[0-9]+` pattern, but a
      # dispatched input is free text, and it is the path AGENTS.md tells you to
      # use (agent credentials cannot push tag refs).
      - name: Version agrees with the manifest
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          fail=0

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not X.Y.Z — Obsidian matches the tag literally, and there is no 'v' prefix here"
            fail=1
          fi

          manifest=$(jq -r '.version' manifest.json)
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::releasing $VERSION, but manifest.json says $manifest — bump it and land the commit first"
            fail=1
          fi

          package=$(jq -r '.version' package.json)
          if [ "$package" != "$VERSION" ]; then
            echo "::error::releasing $VERSION, but package.json says $package"
            fail=1
          fi

          if [ "$(jq -r --arg v "$VERSION" 'has($v)' versions.json)" != "true" ]; then
            echo "::error::versions.json has no entry for $VERSION"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "manifest.json, package.json and versions.json all agree on $VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
