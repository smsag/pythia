name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: no dependency's install hook runs in the same job as
        # the token (engineering-review #286). Nothing here needs one — esbuild's
        # binary arrives via its platform optional dependency and onnxruntime-node
        # ships its CPU binary in-package, both as plain files in the tarball.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check file-size budget
        run: npm run check:filesize

      - name: Type-check & build
        run: npm run build

      - name: Run tests
        run: npm test
